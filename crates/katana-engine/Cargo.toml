[package]
name = "katana-engine"
description = "Session logic for Katana Control: detection, temp reads, verified temp writes, backups and presets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["katana-midi/native", "dep:directories", "dep:humantime"]

[dependencies]
katana-protocol.workspace = true
katana-params.workspace = true
katana-midi.workspace = true
katana-store.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }

[lints]
workspace = true
