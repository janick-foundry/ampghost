name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  cargo-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 build-aux/flatpak/check-cargo-sources.py

  flatpak:
    needs: cargo-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/flatpak/io.github.ampghost.AmpGhost.json
          bundle: ampghost-${{ steps.version.outputs.version }}-x86_64.flatpak
          artifact-name: ampghost-${{ steps.version.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/**', 'Cargo.lock') }}
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ampghost-${{ steps.version.outputs.version }}-x86_64.flatpak
