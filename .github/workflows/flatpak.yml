name: Flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  cargo-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 build-aux/flatpak/check-cargo-sources.py

  flatpak:
    needs: cargo-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        - /usr/share/dotnet:/host/usr/share/dotnet
        - /usr/share/swift:/host/usr/share/swift
        - /usr/local/lib/android:/host/usr/local/lib/android
        - /usr/local/share/boost:/host/usr/local/share/boost
        - /usr/local/.ghcup:/host/usr/local/.ghcup
        - /opt/ghc:/host/opt/ghc
        - /opt/hostedtoolcache:/host/opt/hostedtoolcache
    permissions:
      contents: write
    steps:
      - name: Free disk space on the runner
        shell: bash
        run: |
          df -h /
          for dir in /host/usr/share/dotnet /host/usr/share/swift /host/usr/local/lib/android /host/usr/local/share/boost /host/usr/local/.ghcup /host/opt/ghc /host/opt/hostedtoolcache; do
            find "$dir" -mindepth 1 -delete || true
          done
          df -h /
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/flatpak/io.github.janick_foundry.AmpGhost.json
          bundle: ampghost-${{ steps.version.outputs.version }}-x86_64.flatpak
          artifact-name: ampghost-${{ steps.version.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/**', 'Cargo.lock') }}
      - name: Show disk usage
        if: always()
        shell: bash
        run: |
          df -h /
          du -sh .flatpak-builder flatpak_app repo 2>/dev/null || true
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ampghost-${{ steps.version.outputs.version }}-x86_64.flatpak
