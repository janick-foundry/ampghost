[workspace]
resolver = "3"
members = [
    "crates/tsuba-protocol",
    "crates/tsuba-params",
    "crates/tsuba-midi",
    "crates/tsuba-store",
    "crates/tsuba-engine",
    "crates/tsuba-cli",
    "crates/tsuba-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Jan Klíma <140242059+janick-foundry@users.noreply.github.com>"]
publish = false

[workspace.dependencies]
tsuba-protocol = { path = "crates/tsuba-protocol" }
tsuba-params = { path = "crates/tsuba-params" }
tsuba-midi = { path = "crates/tsuba-midi", default-features = false }
tsuba-store = { path = "crates/tsuba-store" }
tsuba-engine = { path = "crates/tsuba-engine", default-features = false }
thiserror = "2.0.21"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
midir = "0.11.1"
alsa = "0.12.1"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
glib-build-tools = "0.22.8"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
humantime = "2.4.0"
directories = "6.0.0"
sha2 = "0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
